services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ingest
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://ingest:ingest@db:5432/ingest
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
