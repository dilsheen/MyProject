server:
  port: ${PORT:8080}

spring:
  application:
    name: ingest
  sql:
    init:
      mode: always
      continue-on-error: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.dilsheen.ingest: ${LOG_LEVEL:INFO}
